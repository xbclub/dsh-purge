# dsh-purge bundle patch
#
# 清洗 + 演练台都在本插件内（lib/redteam、presets/redteam、skills/redteam）。
# 只装 dsh-purge，不外接、不 link 其它红队包。

- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: ""
    personaSuffix: ""

# 本体的 insert（含 inject/config）统一由用户层 profile/cordis.patch.yml 提供：
# postinstall 的 ensureProfileBodyInsert 会写入那条 insert，演练台自愈补也走同一入口。
# 这里不能再 patch 一次——bundle 层先于 profile 层执行，此时该条目尚未存在，只会产生
# `patch: entry "dsh-purge" not found`；也不能再 insert 一次，会 already queued
# （#152 / #154 / #159）。
# 这里省掉的 autoApplyOnStart / anchorMode / subagentControl 等字段，lib/index.js 的
# DEFAULTS 已给出逐一相同的默认值，不写等价。

- insert:
    # 演练台：预设 + 技能落地（本插件 lib/redteam）
    - id: dsh-purge-redteam
      name: dsh-purge/redteam

    # 演练台事实库（SQLite），数据在 $DSH_HOME/redteam
    - id: dsh-purge-redteam-store
      name: dsh-purge/redteam/store
      config:
        root: !!js dshHomePath('redteam')

    # 演练台 HTTP 桥 POST /redteam/api
    - id: dsh-purge-redteam-ui
      name: dsh-purge/redteam/ui
